<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Ground for the sign-in stage, in Shoof's identity colours: burgundy into espresso, a terracotta light behind the mark. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#62263a"/>
      <stop offset="0.5" stop-color="#541F2D"/>
      <stop offset="1" stop-color="#261C1A"/>
    </linearGradient>
    <radialGradient id="light" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#B95035" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#B95035" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.1" fill="#FBF5E9" fill-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1000" height="1000" fill="url(#ground)"/>
  <rect width="1000" height="1000" fill="url(#light)"/>
  <rect width="1000" height="1000" fill="url(#grid)"/>
  <g fill="none" stroke="#FBF5E9" stroke-width="1.5">
    <circle cx="500" cy="400" r="380" stroke-opacity="0.07"/>
    <circle cx="500" cy="400" r="520" stroke-opacity="0.05"/>
  </g>
</svg>
