# Netlify build for the Shoof Restaurant admin dashboard (served under /admin/)

[build]
  # The build lands in dist/admin; _headers must sit in the publish root (dist) for Netlify to read it.
  command = "npm run build && cp public/_headers dist/_headers"
  publish = "dist"

[build.environment]
  # Vite 8 needs Node 20.19+ / 22.12+
  NODE_VERSION = "22"
  VITE_BASE_URL = "/backend/api/"
  # This host carries no restaurant code, so the app calls the restaurant's own API directly, chosen by the code in the
  # sign-in link: https://{slug}.shoof.lambdor.com/backend/api/. The build adds those hosts to the CSP connect-src, and
  # the API must allow this site's origin (CORS). There is deliberately no /backend proxy: it could only reach one restaurant.
  VITE_API_BASE_DOMAIN = "shoof.lambdor.com"
  VITE_APP_I18N_CONFIG_KEY = "shoof-restaurant-i18n"
  # Set VITE_APP_API_KEY in the Netlify UI (Site configuration > Environment variables) to the PRODUCTION Restaurant key,
  # then redeploy. It is not committed. The dev placeholder is refused by the live API (X-Error-Code: InvalidApiKey).

[[redirects]]
  from = "/"
  to = "/admin/"
  status = 302

# Single-page app: every /admin path that is not a real file serves index.html (client-side router).
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Hashed build assets never change: cache them for a year. Security headers live in public/_headers.
[[headers]]
  for = "/admin/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin/index.html"
  [headers.values]
    Cache-Control = "no-cache"
