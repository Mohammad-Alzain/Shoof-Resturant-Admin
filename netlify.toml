# Netlify build for the Shoof Restaurant admin dashboard (served under /admin/)

[build]
  # The build lands in dist/admin; _headers must sit in the publish root (dist) for Netlify to read it.
  command = "npm run build && cp public/_headers dist/_headers"
  publish = "dist"

[build.environment]
  # Vite 8 needs Node 20.19+ / 22.12+
  NODE_VERSION = "22"
  # Relative: the API is reached on the same origin through the /backend proxy below (no CORS, CSP connect-src 'self').
  VITE_BASE_URL = "/backend/api/"
  VITE_APP_I18N_CONFIG_KEY = "shoof-restaurant-i18n"
  # Set VITE_APP_API_KEY in the Netlify UI (Site configuration > Environment variables): it is not committed.

# Netlify has no /backend of its own: forward it to the restaurant host. Change the host for production.
[[redirects]]
  from = "/backend/*"
  to = "https://pizzahut.shoof.lambdor.com/backend/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/admin/"
  status = 302

# Single-page app: every /admin path that is not a real file serves index.html (client-side router).
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Hashed build assets never change: cache them for a year. Security headers live in public/_headers.
[[headers]]
  for = "/admin/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin/index.html"
  [headers.values]
    Cache-Control = "no-cache"
